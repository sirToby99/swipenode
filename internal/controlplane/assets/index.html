<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>SwipeNode Control Plane</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to workspace</a>
  <aside class="sidebar">
    <div class="brand"><span><strong>SwipeNode<span aria-hidden="true">.</span></strong><small>Customer workspace</small></span></div>
    <nav aria-label="Control Plane views">
      <button data-view="overview" class="nav-item active" aria-current="page">Overview</button>
      <button data-view="packs" class="nav-item">Knowledge</button>
      <button data-view="evidence" class="nav-item">Evidence</button>
      <button data-view="verifications" class="nav-item">Verification</button>
      <button data-view="provenance" class="nav-item">Provenance</button>
      <button data-view="audit" class="nav-item">Audit</button>
      <button data-view="governance" class="nav-item">Governance</button>
    </nav>
    <div class="boundary"><strong><span class="status-dot"></span>Customer-local</strong><small>No telemetry or upstream engineering data.</small></div>
  </aside>
  <main id="main" tabindex="-1">
    <header><div><p class="eyebrow">Engineering verification control plane</p><h1 id="page-title">Overview</h1></div><div id="connection" class="environment"><span class="status-dot"></span>Local runtime</div></header>
    <div id="notice" role="status" aria-live="polite"></div>
    <section id="content" aria-live="polite"><div class="loading">Loading local SwipeNode state…</div></section>
  </main>
  <script src="/assets/app.js" defer></script>
</body>
</html>
